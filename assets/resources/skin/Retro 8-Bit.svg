<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" shape-rendering="crispEdges">
  <!-- 最外层黑色像素描边 -->
  <rect x="0" y="0" width="120" height="120" fill="#181425"/>
  <!-- 底部与右侧暗部阴影（立体厚度） -->
  <rect x="6" y="6" width="108" height="108" fill="#3A4466"/>
  <!-- 核心受光面 (中灰蓝) -->
  <rect x="6" y="6" width="100" height="100" fill="#5A6988"/>
  <!-- 顶部与左侧高光 (高亮白蓝) -->
  <polygon points="6,6 106,6 98,14 14,14 14,98 6,106" fill="#8B9BB4"/>
  <!-- 像素四个内角凹点装饰 -->
  <rect x="18" y="18" width="6" height="6" fill="#181425" opacity="0.3"/>
  <rect x="96" y="18" width="6" height="6" fill="#181425" opacity="0.3"/>
  <rect x="18" y="96" width="6" height="6" fill="#181425" opacity="0.3"/>
  <rect x="96" y="96" width="6" height="6" fill="#181425" opacity="0.3"/>
</svg>
