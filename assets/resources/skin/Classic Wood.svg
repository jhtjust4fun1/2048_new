<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 木纹渐变 -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C39E"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <filter id="woodShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#8C5835" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- 底层投影 -->
  <rect x="4" y="4" width="112" height="112" rx="14" fill="#B07D56" />
  <!-- 主体方块 -->
  <rect x="4" y="4" width="112" height="106" rx="14" fill="url(#woodGrad)" />
  <!-- 内部凹槽装饰边 -->
  <rect x="10" y="10" width="100" height="94" rx="10" fill="none" stroke="#FAEDCD" stroke-width="2" stroke-opacity="0.6"/>
  <!-- 木质条纹点缀 -->
  <path d="M 20 30 Q 60 35 100 28" stroke="#CCD5AE" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <path d="M 15 80 Q 55 75 105 82" stroke="#B07D56" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
</svg>
