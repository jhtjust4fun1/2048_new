<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141526"/>
      <stop offset="100%" stop-color="#080912"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 科技切角底板 -->
  <polygon points="12,4 108,4 116,12 116,108 108,116 12,116 4,108 4,12" fill="url(#cyberBg)"/>
  <!-- 霓虹外发光线框 -->
  <polygon points="12,4 108,4 116,12 116,108 108,116 12,116 4,108 4,12" 
           fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neonGlow)"/>
  <!-- 四角科技卡槽 -->
  <line x1="8" y1="20" x2="8" y2="35" stroke="#FF0055" stroke-width="3"/>
  <line x1="112" y1="85" x2="112" y2="100" stroke="#FF0055" stroke-width="3"/>
  <!-- 内底暗网格 -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3"/>
</svg>
